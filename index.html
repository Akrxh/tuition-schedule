<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuition Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14160f;
    --surface:#1c1f16;
    --surface-raised:#22261a;
    --border:#33372a;
    --text:#eeead9;
    --muted:#a3a58e;
    --faint:#6f7260;
    --accent:#d9a441;
    --done:#8bab6f;
    --done-soft:#26301f;
    --radius:10px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    padding:2.5rem 1.25rem 4rem;
    display:flex;
    justify-content:center;
  }

  main{
    width:100%;
    max-width:600px;
  }

  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:1rem;
    padding-bottom:1.25rem;
    border-bottom:1px solid var(--border);
    margin-bottom:1.75rem;
  }

  .masthead .eyebrow{
    font-size:0.75rem;
    color:var(--faint);
    margin:0 0 0.35rem;
    letter-spacing:0.02em;
  }

  h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:1.85rem;
    margin:0;
    line-height:1.2;
  }

  .masthead .meta{
    text-align:right;
    font-size:0.85rem;
    color:var(--muted);
    line-height:1.5;
  }

  .meta strong{
    color:var(--text);
    font-weight:500;
  }

  section{
    margin-bottom:1.75rem;
  }

  .section-title{
    font-size:0.8rem;
    color:var(--muted);
    margin:0 0 0.75rem;
    font-weight:500;
  }

  .progress-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:1.1rem 1.25rem;
  }

  .progress-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:0.65rem;
    gap:0.75rem;
  }

  .progress-top .figure{
    font-family:'Source Serif 4', serif;
    font-size:1.5rem;
    color:var(--accent);
    white-space:nowrap;
  }

  .progress-top .figure span{
    font-size:1rem;
    color:var(--muted);
    font-family:'Inter',sans-serif;
  }

  .progress-top .caption{
    font-size:0.85rem;
    color:var(--muted);
    text-align:right;
  }

  .track{
    height:8px;
    border-radius:999px;
    background:var(--surface-raised);
    overflow:hidden;
    border:1px solid var(--border);
  }

  .fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
    transition:width 0.6s ease;
  }

  .class-list{
    display:flex;
    flex-direction:column;
    gap:0.6rem;
  }

  .class-row{
    display:flex;
    align-items:center;
    gap:0.9rem;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:0.85rem 1rem;
  }

  .check{
    flex:none;
    width:22px;
    height:22px;
    border-radius:6px;
    border:1.5px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface-raised);
  }

  .class-row.is-done .check{
    background:var(--done-soft);
    border-color:var(--done);
  }

  .check svg{
    width:13px;
    height:13px;
    display:none;
  }

  .class-row.is-done .check svg{
    display:block;
  }

  .class-row.is-done .check svg path{
    stroke:var(--done);
  }

  .class-body{
    flex:1;
    min-width:0;
  }

  .class-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:0.5rem;
  }

  .subject{
    font-weight:500;
    font-size:0.98rem;
  }

  .day{
    font-size:0.75rem;
    color:var(--muted);
    white-space:nowrap;
  }

  .class-details{
    margin-top:0.3rem;
    font-size:0.83rem;
    color:var(--muted);
    display:flex;
    flex-wrap:wrap;
    gap:0.4rem 0.9rem;
  }

  .class-details span{
    display:inline-flex;
    align-items:center;
    gap:0.35rem;
  }

  .class-details svg{
    width:13px;
    height:13px;
    flex:none;
    opacity:0.7;
  }

  .status-tag{
    margin-top:0.35rem;
    font-size:0.72rem;
    display:inline-block;
    color:var(--faint);
  }

  .class-row.is-done .status-tag{
    color:var(--done);
  }

  .note-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:var(--radius);
    padding:1.1rem 1.25rem;
    font-size:0.92rem;
    line-height:1.65;
    color:var(--text);
  }

  footer{
    text-align:center;
    font-size:0.75rem;
    color:var(--faint);
    margin-top:2rem;
  }

  .state-msg{
    color:var(--muted);
    font-size:0.9rem;
    padding:2rem 0;
    text-align:center;
  }

  @media (max-width:420px){
    .masthead{
      flex-direction:column;
      align-items:flex-start;
    }
    .masthead .meta{
      text-align:left;
    }
    h1{
      font-size:1.55rem;
    }
  }
</style>
</head>
<body>
<main>

  <div class="masthead">
    <div>
      <p class="eyebrow">Tuition Schedule</p>
      <h1 id="student-name">Weekly Routine</h1>
    </div>
    <div class="meta">
      <div id="term-label">Active Schedule</div>
      <div><strong id="today-date">&nbsp;</strong></div>
    </div>
  </div>

  <section id="progress-section">
    <p class="section-title">Weekly Progress</p>
    <div class="progress-card">
      <div class="progress-top">
        <div class="figure" id="progress-count">0<span> / 0</span></div>
        <div class="caption" id="progress-caption">sessions completed</div>
      </div>
      <div class="track"><div class="fill" id="progress-fill" style="width:0%;"></div></div>
    </div>
  </section>

  <section>
    <p class="section-title">Classes</p>
    <div class="class-list" id="class-list">
      <p class="state-msg">Loading schedule…</p>
    </div>
  </section>

  <section id="note-section" style="display:none;">
    <p class="section-title">Note</p>
    <div class="note-card" id="note-text"></div>
  </section>

  <footer>View only &middot; updated automatically</footer>

</main>

<script>
  const CHECK_ICON = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CLOCK_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.6 1.5"/></svg>';
  const PIN_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 14s4.6-4.2 4.6-7.6A4.6 4.6 0 0 0 8 1.8 4.6 4.6 0 0 0 3.4 6.4C3.4 9.8 8 14 8 14z"/><circle cx="8" cy="6.3" r="1.6"/></svg>';

  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function todayLabel(){
    return new Date().toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });
  }

  function isTimePassed(dayName, timeStr) {
    if (!dayName || !timeStr) return false;

    const now = new Date();
    const currentDayIdx = now.getDay();
    const targetDayIdx = DAYS.findIndex(d => d.toLowerCase() === dayName.trim().toLowerCase());

    if (targetDayIdx === -1) return false;

    if (targetDayIdx < currentDayIdx) return true;
    if (targetDayIdx > currentDayIdx) return false;

    const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)?/i);
    if (!match) return false;

    let hours = parseInt(match[1], 10);
    const minutes = parseInt(match[2], 10);
    const modifier = match[3];

    if (modifier) {
      if (modifier.toUpperCase() === 'PM' && hours < 12) hours += 12;
      if (modifier.toUpperCase() === 'AM' && hours === 12) hours = 0;
    }

    const classTime = new Date();
    classTime.setHours(hours, minutes, 0, 0);

    return now >= classTime;
  }

  function render(data){
    document.getElementById('today-date').textContent = todayLabel();

    const classes = Array.isArray(data.classes) ? data.classes : [];
    
    let completed = 0;
    classes.forEach(c => {
      if (c.done || c.attended || isTimePassed(c.day, c.time)) {
        completed++;
      }
    });

    const total = classes.length;
    const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

    document.getElementById('progress-count').innerHTML = completed + '<span> / ' + total + '</span>';
    document.getElementById('progress-caption').textContent = 'sessions completed';
    document.getElementById('progress-fill').style.width = pct + '%';

    const list = document.getElementById('class-list');
    list.innerHTML = '';

    if(classes.length === 0){
      list.innerHTML = '<p class="state-msg">No classes scheduled.</p>';
    }

    classes.forEach(function(c){
      const done = !!(c.done || c.attended || isTimePassed(c.day, c.time));

      const row = document.createElement('div');
      row.className = 'class-row' + (done ? ' is-done' : '');

      const detailBits = [];
      if(c.time) detailBits.push('<span>' + CLOCK_ICON + c.time + '</span>');
      if(c.location) detailBits.push('<span>' + PIN_ICON + c.location + '</span>');

      row.innerHTML =
        '<div class="check">' + CHECK_ICON + '</div>' +
        '<div class="class-body">' +
          '<div class="class-top">' +
            '<span class="subject">' + (c.subject || 'Class') + (c.tutor ? ' &middot; ' + c.tutor : '') + '</span>' +
            '<span class="day">' + (c.day || '') + '</span>' +
          '</div>' +
          (detailBits.length > 0 ? '<div class="class-details">' + detailBits.join('') + '</div>' : '') +
          '<div class="status-tag">' + (done ? 'Attended' : 'Upcoming') + '</div>' +
        '</div>';

      list.appendChild(row);
    });

    if(data.note){
      document.getElementById('note-section').style.display = '';
      document.getElementById('note-text').textContent = data.note;
    }
  }

  fetch('data.json')
    .then(function(res){
      if(!res.ok) throw new Error('Could not load data.json');
      return res.json();
    })
    .then(render)
    .catch(function(err){
      document.getElementById('class-list').innerHTML =
        '<p class="state-msg">Could not load the schedule (' + err.message + ').</p>';
    });
</script>
</body>
</html>
