<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14160f;
    --surface:#1c1f16;
    --surface-raised:#22261a;
    --border:#33372a;
    --text:#eeead9;
    --muted:#a3a58e;
    --faint:#5f624f;
    --accent:#d9a441;
    --accent-dark:#8c6b22;
    --danger:#c56a4f;
    --today:#8bab6f;
    --today-soft:#232c1c;
    --radius:12px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    padding:2.5rem 1.25rem 4rem;
    display:flex;
    justify-content:center;
  }

  main{
    width:100%;
    max-width:620px;
  }

  header{
    padding-bottom:1.25rem;
    border-bottom:1px solid var(--border);
    margin-bottom:1.75rem;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:1rem;
    flex-wrap:wrap;
  }

  .eyebrow{
    font-size:0.75rem;
    color:var(--faint);
    margin:0 0 0.35rem;
    letter-spacing:0.02em;
  }

  h1{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    font-size:1.85rem;
    margin:0 0 0.35rem;
    line-height:1.2;
  }

  .subhead{
    font-size:0.88rem;
    color:var(--muted);
  }

  .header-actions{
    display:flex;
    gap:0.5rem;
    padding-bottom:0.2rem;
  }

  button{
    font-family:'Inter', sans-serif;
    cursor:pointer;
  }

  .btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:8px;
    padding:0.5rem 0.9rem;
    font-size:0.83rem;
    font-weight:500;
    display:inline-flex;
    align-items:center;
    gap:0.4rem;
    transition:background 0.15s ease, border-color 0.15s ease;
  }

  .btn:hover{
    border-color:var(--accent-dark);
  }

  .btn.primary{
    background:var(--accent-soft, #3a3220);
    border-color:var(--accent-dark);
    color:var(--accent);
  }

  .btn.primary.is-active{
    background:var(--accent);
    color:#1a1608;
    border-color:var(--accent);
  }

  .btn.ghost{
    background:transparent;
    color:var(--muted);
    font-size:0.78rem;
    padding:0.4rem 0.7rem;
  }

  .btn svg{ width:14px; height:14px; }

  .week{
    display:flex;
    flex-direction:column;
    gap:0.6rem;
  }

  .day-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid transparent;
    border-radius:var(--radius);
    padding:0.9rem 1.1rem;
    display:flex;
    gap:1rem;
    align-items:flex-start;
    transition:opacity 0.15s ease;
  }

  .day-card.is-today{
    border-left-color:var(--today);
    background:var(--today-soft);
  }

  .day-card.is-free{
    opacity:0.65;
  }

  body.edit-mode .day-card.is-free{
    opacity:1;
  }

  .day-label{
    flex:none;
    width:92px;
    padding-top:0.15rem;
  }

  .day-name{
    font-weight:600;
    font-size:0.92rem;
  }

  .today-tag{
    display:inline-block;
    margin-top:0.25rem;
    font-size:0.65rem;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--today);
    background:rgba(139,171,111,0.12);
    border:1px solid rgba(139,171,111,0.35);
    border-radius:999px;
    padding:0.12rem 0.5rem;
  }

  .day-classes{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:0.5rem;
    min-width:0;
  }

  .class-pill{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.75rem;
    background:var(--surface-raised);
    border:1px solid var(--border);
    border-radius:8px;
    padding:0.5rem 0.75rem;
  }

  .class-pill .left{
    display:flex;
    align-items:center;
    gap:0.75rem;
    min-width:0;
  }

  .class-pill .subject{
    font-weight:500;
    font-size:0.9rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .class-pill .subject::before{
    content:'';
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    margin-right:0.5rem;
  }

  .class-pill .time{
    font-size:0.8rem;
    color:var(--muted);
    white-space:nowrap;
  }

  .remove-btn{
    flex:none;
    width:22px;
    height:22px;
    border-radius:6px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    display:none;
    align-items:center;
    justify-content:center;
    font-size:0.9rem;
    line-height:1;
  }

  body.edit-mode .remove-btn{
    display:flex;
  }

  .remove-btn:hover{
    border-color:var(--danger);
    color:var(--danger);
  }

  .no-class{
    font-size:0.85rem;
    color:var(--faint);
    font-style:italic;
    padding:0.35rem 0;
  }

  .day-toggle{
    display:none;
    align-items:center;
    gap:0.4rem;
    font-size:0.76rem;
    color:var(--muted);
    margin-top:0.5rem;
    cursor:pointer;
    user-select:none;
  }

  body.edit-mode .day-toggle{
    display:inline-flex;
  }

  .day-toggle input{
    accent-color:var(--accent);
    width:14px;
    height:14px;
  }

  .add-row{
    display:none;
    gap:0.5rem;
    margin-top:0.15rem;
  }

  body.edit-mode .add-row{
    display:flex;
    flex-wrap:wrap;
  }

  .add-row input{
    font-family:'Inter', sans-serif;
    background:var(--surface-raised);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:0.45rem 0.6rem;
    font-size:0.83rem;
  }

  .add-row .subj-input{ flex:1; min-width:100px; }
  .add-row .time-input{ width:110px; }

  .add-row .add-btn{
    flex:none;
    width:32px;
    height:32px;
    border-radius:8px;
    border:1px solid var(--accent-dark);
    background:var(--accent-soft, #3a3220);
    color:var(--accent);
    font-size:1.1rem;
    line-height:1;
  }

  footer{
    text-align:center;
    font-size:0.75rem;
    color:var(--faint);
    margin-top:2rem;
  }

  .state-msg{
    color:var(--muted);
    font-size:0.9rem;
    padding:2rem 0;
    text-align:center;
  }

  .note-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:var(--radius);
    padding:1rem 1.15rem;
    font-size:0.9rem;
    line-height:1.6;
    color:var(--text);
    margin-top:1.25rem;
  }

  .note-card .section-title{
    font-size:0.75rem;
    color:var(--muted);
    margin:0 0 0.4rem;
    font-weight:500;
  }

  .save-note{
    text-align:center;
    font-size:0.78rem;
    color:var(--accent);
    margin-top:1rem;
    min-height:1.1em;
    opacity:0;
    transition:opacity 0.3s ease;
  }

  .save-note.show{
    opacity:1;
  }

  @media (max-width:420px){
    header{
      flex-direction:column;
      align-items:flex-start;
    }
    .day-card{
      flex-direction:column;
      gap:0.6rem;
    }
    .day-label{
      width:auto;
      display:flex;
      align-items:center;
      gap:0.6rem;
    }
    .today-tag{
      margin-top:0;
    }
  }
</style>
</head>
<body>
<main>

  <header>
    <div>
      <p class="eyebrow">Weekly routine</p>
      <h1 id="page-title">&nbsp;</h1>
      <p class="subhead" id="today-line"></p>
    </div>
    <div class="header-actions">
      <button class="btn primary" id="edit-toggle">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M11.5 2.5l2 2L5 13l-2.7.7.7-2.7 8.5-8.5z"/></svg>
        <span>Edit</span>
      </button>
    </div>
  </header>

  <div class="week" id="week-list">
    <p class="state-msg">Loading routine…</p>
  </div>

  <div class="note-card" id="note-section" style="display:none;">
    <p class="section-title">Note</p>
    <div id="note-text"></div>
  </div>

  <p class="save-note" id="save-note">Saved</p>

  <footer>
    <span id="edit-footer" style="display:none;">Changes are saved on this device &middot; </span>
    <button class="btn ghost" id="reset-btn" style="display:none; margin:0.5rem auto 0;">Reset to original routine</button>
  </footer>

</main>

<script>
  const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const STORAGE_KEY = 'routine-data-v2-science';

  let routineData = null;
  let editMode = false;
  let saveTimer = null;

  function loadStored(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(routineData));
      const note = document.getElementById('save-note');
      note.textContent = 'Saved';
      note.classList.add('show');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){ note.classList.remove('show'); }, 1200);
    }catch(e){}
  }

  function findDay(name){
    return routineData.days.find(function(d){ return d.day === name; });
  }

  function renderWeek(){
    const todayName = WEEKDAYS[new Date().getDay()];
    document.getElementById('today-line').textContent = 'Today is ' + todayName;

    const list = document.getElementById('week-list');
    list.innerHTML = '';
    const days = Array.isArray(routineData.days) ? routineData.days : [];

    days.forEach(function(d){
      const classes = Array.isArray(d.classes) ? d.classes : [];
      const isFree = classes.length === 0;
      const isToday = d.day === todayName;

      const card = document.createElement('div');
      card.className = 'day-card' + (isToday ? ' is-today' : '') + (isFree ? ' is-free' : '');
      card.dataset.day = d.day;

      let classesHtml = '';
      if(isFree){
        classesHtml = '<div class="no-class">No class</div>';
      } else {
        classesHtml = classes.map(function(c, i){
          return '<div class="class-pill">' +
                   '<div class="left"><span class="subject">' + escapeHtml(c.subject || 'Class') +
                   '</span><span class="time">' + escapeHtml(c.time || '') + '</span></div>' +
                   '<button class="remove-btn" data-day="' + d.day + '" data-index="' + i + '" aria-label="Remove class">&times;</button>' +
                 '</div>';
        }).join('');
      }

      const toggleHtml =
        '<label class="day-toggle"><input type="checkbox" class="free-toggle" data-day="' + d.day + '"' +
        (isFree ? ' checked' : '') + '> No class today</label>';

      const addRowHtml =
        '<div class="add-row" data-day="' + d.day + '">' +
          '<input type="text" class="subj-input" placeholder="Subject" maxlength="40">' +
          '<input type="text" class="time-input" placeholder="Time" maxlength="30">' +
          '<button class="add-btn" data-day="' + d.day + '" aria-label="Add class">+</button>' +
        '</div>';

      card.innerHTML =
        '<div class="day-label">' +
          '<div class="day-name">' + d.day + '</div>' +
          (isToday ? '<span class="today-tag">Today</span>' : '') +
        '</div>' +
        '<div class="day-classes">' + classesHtml + toggleHtml + addRowHtml + '</div>';

      list.appendChild(card);
    });

    attachHandlers();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function attachHandlers(){
    document.querySelectorAll('.remove-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const day = findDay(btn.dataset.day);
        const idx = parseInt(btn.dataset.index, 10);
        day.classes.splice(idx, 1);
        persist();
        renderWeek();
      });
    });

    document.querySelectorAll('.free-toggle').forEach(function(box){
      box.addEventListener('change', function(){
        const day = findDay(box.dataset.day);
        if(box.checked){
          day._savedClasses = day.classes;
          day.classes = [];
        } else {
          day.classes = day._savedClasses && day._savedClasses.length ? day._savedClasses : [];
          delete day._savedClasses;
        }
        persist();
        renderWeek();
      });
    });

    document.querySelectorAll('.add-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        addClass(btn.dataset.day, btn);
      });
    });

    document.querySelectorAll('.add-row input').forEach(function(input){
      input.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          const row = input.closest('.add-row');
          addClass(row.dataset.day, row.querySelector('.add-btn'));
        }
      });
    });
  }

  function addClass(dayName, btnEl){
    const row = btnEl.closest('.add-row');
    const subj = row.querySelector('.subj-input').value.trim();
    const time = row.querySelector('.time-input').value.trim();
    if(!subj){
      row.querySelector('.subj-input').focus();
      return;
    }
    const day = findDay(dayName);
    day.classes.push({ subject: subj, time: time });
    persist();
    renderWeek();
  }

  function setEditMode(on){
    editMode = on;
    document.body.classList.toggle('edit-mode', on);
    const btn = document.getElementById('edit-toggle');
    btn.classList.toggle('is-active', on);
    btn.querySelector('span').textContent = on ? 'Done' : 'Edit';
    document.getElementById('edit-footer').style.display = on ? 'inline' : 'none';
    document.getElementById('reset-btn').style.display = on ? 'inline-block' : 'none';
  }

  document.getElementById('edit-toggle').addEventListener('click', function(){
    setEditMode(!editMode);
  });

  document.getElementById('reset-btn').addEventListener('click', function(){
    if(!confirm('Reset the routine back to the original schedule? Your edits will be lost.')) return;
    localStorage.removeItem(STORAGE_KEY);
    fetch('data.json').then(function(r){ return r.json(); }).then(function(fresh){
      routineData = fresh;
      const noteSection = document.getElementById('note-section');
      if(routineData.note){
        noteSection.style.display = '';
        document.getElementById('note-text').textContent = routineData.note;
      } else {
        noteSection.style.display = 'none';
      }
      renderWeek();
    });
  });

  fetch('data.json')
    .then(function(res){
      if(!res.ok) throw new Error('Could not load data.json');
      return res.json();
    })
    .then(function(fresh){
      const stored = loadStored();
      routineData = stored || fresh;
      document.getElementById('page-title').textContent = routineData.title || 'Weekly routine';
      if(routineData.note){
        document.getElementById('note-section').style.display = '';
        document.getElementById('note-text').textContent = routineData.note;
      }
      renderWeek();
    })
    .catch(function(err){
      document.getElementById('week-list').innerHTML =
        '<p class="state-msg">Could not load the routine (' + err.message + ').</p>';
    });
</script>
</body>
</html>
