<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuition Schedule | Manga Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { boxShadow: {
      comic: "4px 4px 0 #000", "comic-sm": "2px 2px 0 #000", "comic-lg": "6px 6px 0 #000"
    } } }
  };
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; font-family:"Plus Jakarta Sans", sans-serif; color:#000;
    background:#f4f1e8;
  }
  .manga-title { font-family:"Bangers", cursive; letter-spacing:1.5px; line-height:1.1; }
  .comic-panel { background:#fff; border:3px solid #000; box-shadow:4px 4px 0 #000; transition:transform .15s ease, box-shadow .15s ease; }
  .comic-nav { background:#fff; border:3px solid #000; box-shadow:4px 4px 0 #000; }
  .comic-btn { background:#000; color:#fff; border:2px solid #000; box-shadow:3px 3px 0 #000; transition:.1s; }
  .comic-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
  .comic-btn-white { background:#fff; color:#000; border:2px solid #000; box-shadow:3px 3px 0 #000; transition:.1s; }
  .comic-btn-white:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
  input, select { border:2px solid #000 !important; box-shadow:2px 2px 0 #000 !important; }
  input:focus, select:focus { outline:none; background:#fff; }
  .tag { font-size:10px; font-weight:900; text-transform:uppercase; padding:2px 8px; border-radius:999px; border:2px solid #000; }
  .tag-attending { background:#7fd858; animation:pulse 1.1s infinite; }
  .tag-online { background:#8ec9ff; }
  .tag-offline { background:#ffd166; }
  .tag-postponed { background:#ffb3b3; }
  .card-check { width:18px; height:18px; accent-color:#000; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
  @keyframes popIn { 0%{transform:scale(.94);opacity:0;} 100%{transform:scale(1);opacity:1;} }
  .animate-pop { animation:popIn .2s cubic-bezier(.16,1,.3,1) forwards; }
  .modal-backdrop { background:rgba(0,0,0,.6); backdrop-filter:blur(6px); }
</style>
</head>
<body class="pb-20">

<header class="fixed top-4 left-0 right-0 z-40 flex justify-center px-4">
  <nav class="comic-nav rounded-full pl-2 pr-3 py-2 flex items-center justify-between gap-2 max-w-2xl w-full">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center font-black text-sm shrink-0">T</div>
      <span class="manga-title text-lg hidden md:inline">TUITION LOG</span>
      <div id="conn-pill" class="flex items-center gap-1.5 px-2 py-1 rounded-full border-2 border-black text-[10px] font-black bg-gray-100 shrink-0">
        <span id="conn-dot" class="w-2 h-2 rounded-full bg-gray-500 shrink-0"></span><span id="conn-text">Offline</span>
      </div>
    </div>
    <div class="flex items-center gap-1 text-sm font-bold">
      <button onclick="switchTab('home')" id="nav-home" class="px-3 py-1.5 rounded-full bg-black text-white">Today</button>
      <button onclick="switchTab('week')" id="nav-week" class="px-3 py-1.5 rounded-full hover:bg-gray-100">Week</button>
    </div>
  </nav>
</header>

<main class="w-full max-w-2xl mx-auto px-4 pt-28 pb-10">

  <section id="view-home" class="space-y-6 animate-pop">
    <div>
      <h1 class="manga-title text-3xl uppercase" id="today-heading">Today</h1>
      <div id="live-panel" class="mt-3"></div>
    </div>

    <div class="space-y-3">
      <div class="flex justify-between items-center flex-wrap gap-2">
        <h2 class="manga-title text-xl uppercase">Today's Classes</h2>
        <button id="cancel-selected-btn" onclick="cancelSelected()" class="hidden comic-btn px-3 py-1.5 rounded-lg text-xs font-black uppercase">
          <i class="fa-solid fa-ban mr-1"></i>Cancel Selected (<span id="cancel-count">0</span>)
        </button>
      </div>
      <div id="today-list" class="space-y-3"></div>
    </div>

    <div class="space-y-3">
      <h2 class="manga-title text-xl uppercase">Tomorrow's Classes</h2>
      <div id="tomorrow-list" class="space-y-3"></div>
    </div>
  </section>

  <section id="view-week" class="space-y-4 hidden animate-pop">
    <div class="flex justify-between items-center">
      <h1 class="manga-title text-3xl uppercase">Week</h1>
      <button onclick="openAddModal()" class="comic-btn px-3 py-2 rounded-xl text-xs font-black uppercase">
        <i class="fa-solid fa-plus mr-1"></i>Add Class
      </button>
    </div>
    <div id="week-list" class="space-y-4"></div>
  </section>

</main>

<div id="edit-modal" class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4 hidden">
  <div class="comic-panel rounded-2xl p-6 max-w-sm w-full bg-white space-y-4 animate-pop">
    <div class="flex justify-between items-center">
      <h3 class="manga-title text-xl uppercase" id="modal-title">Edit Class</h3>
      <button onclick="closeModal()" class="w-7 h-7 rounded-lg border-2 border-black bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
    </div>
    <form id="class-form" class="space-y-3">
      <input type="hidden" id="f-id">
      <div>
        <label class="block text-xs font-black uppercase mb-1">Subject</label>
        <input type="text" id="f-subject" required class="w-full rounded-xl px-3 py-2.5 font-bold text-sm bg-gray-50">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-black uppercase mb-1">Day</label>
          <select id="f-day" class="w-full rounded-xl px-3 py-2.5 font-bold text-sm bg-gray-50">
            <option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-black uppercase mb-1">Mode</label>
          <select id="f-mode" class="w-full rounded-xl px-3 py-2.5 font-bold text-sm bg-gray-50">
            <option value="online">Online</option><option value="offline">Offline</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-black uppercase mb-1">Start Time</label>
          <input type="time" id="f-start" required class="w-full rounded-xl px-3 py-2.5 font-bold text-sm bg-gray-50">
        </div>
        <div>
          <label class="block text-xs font-black uppercase mb-1">End Time</label>
          <input type="time" id="f-end" required class="w-full rounded-xl px-3 py-2.5 font-bold text-sm bg-gray-50">
        </div>
      </div>
      <button type="submit" class="w-full py-3 rounded-xl comic-btn font-black text-sm uppercase">Save Class</button>
    </form>
  </div>
</div>

<div id="postpone-modal" class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4 hidden">
  <div class="comic-panel rounded-2xl p-6 max-w-sm w-full bg-white space-y-4 animate-pop">
    <div class="flex justify-between items-center">
      <h3 class="manga-title text-xl uppercase">Postpone Class</h3>
      <button onclick="closePostponeModal()" class="w-7 h-7 rounded-lg border-2 border-black bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
    </div>
    <p class="text-xs font-bold text-gray-700" id="postpone-sub"></p>
    <input type="hidden" id="pp-id">
    <div>
      <label class="block text-xs font-black uppercase mb-1">Postpone to date</label>
      <input type="date" id="pp-date" required class="w-full rounded-xl px-3 py-2.5 font-bold text-sm bg-gray-50">
    </div>
    <button onclick="confirmPostpone()" class="w-full py-3 rounded-xl comic-btn font-black text-sm uppercase">Save Date</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, arrayUnion
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsJMm7_wibh45hM5ZOX1iO4eqPPGJbCmA",
  authDomain: "tuition-schedule.firebaseapp.com",
  projectId: "tuition-schedule",
  storageBucket: "tuition-schedule.firebasestorage.app",
  messagingSenderId: "385581385979",
  appId: "1:385581385979:web:1dec658e0b239f579f085e"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const CLASSES_COL = collection(db, "classes");

const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let classes = [];
let selectedIds = new Set();

function setConn(status, text) {
  const dot = document.getElementById("conn-dot");
  const label = document.getElementById("conn-text");
  const colors = { online:"bg-green-600", syncing:"bg-yellow-500", offline:"bg-red-600" };
  if (dot) dot.className = "w-2 h-2 rounded-full " + (colors[status] || "bg-gray-500");
  if (label) label.innerText = text;
}

setConn("syncing", "Connecting...");

onSnapshot(CLASSES_COL, snap => {
  classes = [];
  snap.forEach(d => classes.push({ id: d.id, ...d.data() }));
  setConn("online", "Online");
  renderAll();
}, err => {
  console.error(err);
  setConn("offline", "Offline");
});

window.addEventListener("online", () => setConn("syncing", "Connecting..."));
window.addEventListener("offline", () => setConn("offline", "Offline"));

function toMinutes(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }

function formatDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatDateLabel(dateStr) {
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

// Whether a class occurs on the given date, accounting for cancellations
// and a postponement to a specific date.
function occursOnDate(c, dateObj) {
  const dateStr = formatDate(dateObj);
  if ((c.cancelledDates || []).includes(dateStr)) return false;
  if (c.postponed && c.postponedDate) return c.postponedDate === dateStr;
  const weekday = WEEKDAYS[dateObj.getDay()];
  return c.day === weekday;
}

function classStatus(c, now) {
  const nowMin = now.getHours()*60 + now.getMinutes();
  const start = toMinutes(c.start), end = toMinutes(c.end);
  if (nowMin >= start && nowMin < end) return "attending";
  if (nowMin < start) return "upcoming";
  return "past";
}

function renderAll() {
  const now = new Date();
  const tomorrowDate = new Date(now); tomorrowDate.setDate(now.getDate()+1);
  document.getElementById("today-heading").innerText = WEEKDAYS[now.getDay()];
  renderToday(now);
  renderTomorrow(tomorrowDate);
  renderWeek(now);
  updateCancelBar();
}

function renderToday(now) {
  const todays = classes.filter(c => occursOnDate(c, now))
    .sort((a,b) => toMinutes(a.start) - toMinutes(b.start));

  const livePanel = document.getElementById("live-panel");
  const attending = todays.find(c => classStatus(c, now) === "attending");

  if (attending) {
    livePanel.innerHTML = `
      <div class="comic-panel rounded-2xl p-5 flex items-center justify-between gap-3">
        <div>
          <span class="tag tag-attending">Attending</span>
          <h2 class="manga-title text-2xl uppercase mt-1">${escapeHtml(attending.subject)}</h2>
          <p class="text-sm font-bold text-gray-700">${attending.start} - ${attending.end} &bull; ${attending.mode === 'online' ? 'Online' : 'Offline'}</p>
        </div>
        <i class="fa-solid fa-bolt text-3xl"></i>
      </div>`;
  } else if (!todays.length) {
    livePanel.innerHTML = `
      <div class="comic-panel rounded-2xl p-6 text-center">
        <i class="fa-solid fa-mug-hot text-2xl mb-2"></i>
        <p class="font-black">There is no class now.</p>
      </div>`;
  } else {
    livePanel.innerHTML = "";
  }

  const list = document.getElementById("today-list");
  if (!todays.length) {
    list.innerHTML = '<p class="text-xs font-bold text-gray-500 italic">No class today</p>';
    return;
  }
  list.innerHTML = todays.map(c => renderClassCard(c, classStatus(c, now), true)).join("");
}

function renderTomorrow(tomorrowDate) {
  const list = document.getElementById("tomorrow-list");
  const tomorrows = classes.filter(c => occursOnDate(c, tomorrowDate))
    .sort((a,b) => toMinutes(a.start) - toMinutes(b.start));
  if (!tomorrows.length) {
    list.innerHTML = '<p class="text-xs font-bold text-gray-500 italic">No class tomorrow</p>';
    return;
  }
  list.innerHTML = tomorrows.map(c => renderClassCard(c, "other", false)).join("");
}

function renderWeek(now) {
  const container = document.getElementById("week-list");
  const todayIdx = now.getDay();
  container.innerHTML = WEEKDAYS.map((day, idx) => {
    const offset = (idx - todayIdx + 7) % 7;
    const dateObj = new Date(now); dateObj.setDate(now.getDate() + offset);
    const dayClasses = classes.filter(c => occursOnDate(c, dateObj))
      .sort((a,b) => toMinutes(a.start) - toMinutes(b.start));
    const isToday = offset === 0;
    return `
      <div class="comic-panel rounded-2xl p-4 ${isToday ? 'ring-2 ring-black' : ''}">
        <div class="flex justify-between items-center mb-2">
          <h3 class="manga-title text-lg uppercase">${day}${isToday ? ' <span class="text-xs align-middle">(Today)</span>' : ''}</h3>
        </div>
        <div class="space-y-2">
          ${dayClasses.length ? dayClasses.map(c => renderClassCard(c, "other", false)).join("") : '<p class="text-xs font-bold text-gray-500 italic">No class</p>'}
        </div>
      </div>`;
  }).join("");
}

function renderClassCard(c, status, selectable) {
  const modeTag = c.mode === "online"
    ? '<span class="tag tag-online">Online</span>'
    : '<span class="tag tag-offline">Offline</span>';
  const attendingTag = status === "attending" ? '<span class="tag tag-attending">Attending</span>' : '';
  const postponedTag = c.postponed && c.postponedDate ? `<span class="tag tag-postponed">Postponed to ${formatDateLabel(c.postponedDate)}</span>` : '';
  const checkbox = selectable
    ? `<input type="checkbox" class="card-check" onchange="toggleSelect('${c.id}', this.checked)" ${selectedIds.has(c.id) ? "checked" : ""}>`
    : '';

  return `
    <div class="border-2 border-black rounded-xl p-3 flex items-center justify-between gap-3 bg-gray-50">
      <div class="flex items-center gap-3 min-w-0">
        ${checkbox}
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-1.5 mb-1">
            <h4 class="font-black text-sm truncate">${escapeHtml(c.subject)}</h4>
            ${modeTag}${attendingTag}${postponedTag}
          </div>
          <p class="text-xs font-bold text-gray-700">${c.start} - ${c.end} &bull; ${c.day}</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="toggleMode('${c.id}','${c.mode}')" class="comic-btn-white w-8 h-8 rounded-lg flex items-center justify-center text-xs" title="Toggle online/offline">
          <i class="fa-solid fa-signal"></i>
        </button>
        <button onclick="openPostponeModal('${c.id}')" class="comic-btn-white w-8 h-8 rounded-lg flex items-center justify-center text-xs" title="Postpone">
          <i class="fa-solid fa-forward"></i>
        </button>
        ${c.postponed
          ? `<button onclick="unpostponeClass('${c.id}')" class="comic-btn-white w-8 h-8 rounded-lg flex items-center justify-center text-xs" title="Undo postpone"><i class="fa-solid fa-rotate-left"></i></button>`
          : ``
        }
        <button onclick="editClass('${c.id}')" class="comic-btn-white w-8 h-8 rounded-lg flex items-center justify-center text-xs"><i class="fa-solid fa-pen"></i></button>
        <button onclick="deleteClass('${c.id}')" class="comic-btn-white w-8 h-8 rounded-lg flex items-center justify-center text-xs"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`;
}

function updateCancelBar() {
  const btn = document.getElementById("cancel-selected-btn");
  const count = document.getElementById("cancel-count");
  count.innerText = selectedIds.size;
  btn.classList.toggle("hidden", selectedIds.size === 0);
}

function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

window.switchTab = function(tab) {
  ["home","week"].forEach(t => {
    document.getElementById(`view-${t}`).classList.toggle("hidden", t !== tab);
    document.getElementById(`nav-${t}`).className = t === tab
      ? "px-3 py-1.5 rounded-full bg-black text-white"
      : "px-3 py-1.5 rounded-full hover:bg-gray-100";
  });
};

window.toggleSelect = function(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id);
  updateCancelBar();
};

window.cancelSelected = async function() {
  if (!selectedIds.size) return;
  if (!confirm(`Cancel ${selectedIds.size} class(es) for today?`)) return;
  const todayStr = formatDate(new Date());
  try {
    setConn("syncing", "Saving...");
    for (const id of selectedIds) {
      await updateDoc(doc(db, "classes", id), { cancelledDates: arrayUnion(todayStr) });
    }
    selectedIds.clear();
  } catch (err) {
    console.error(err);
    alert("Failed to cancel some classes.");
  }
};

window.openAddModal = function() {
  document.getElementById("modal-title").innerText = "Add Class";
  document.getElementById("f-id").value = "";
  document.getElementById("class-form").reset();
  document.getElementById("edit-modal").classList.remove("hidden");
};

window.editClass = function(id) {
  const c = classes.find(x => x.id === id);
  if (!c) return;
  document.getElementById("modal-title").innerText = "Edit Class";
  document.getElementById("f-id").value = c.id;
  document.getElementById("f-subject").value = c.subject;
  document.getElementById("f-day").value = c.day;
  document.getElementById("f-mode").value = c.mode;
  document.getElementById("f-start").value = c.start;
  document.getElementById("f-end").value = c.end;
  document.getElementById("edit-modal").classList.remove("hidden");
};

window.closeModal = function() {
  document.getElementById("edit-modal").classList.add("hidden");
};

document.getElementById("class-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("f-id").value;
  const existing = id ? classes.find(c => c.id === id) : null;
  const data = {
    subject: document.getElementById("f-subject").value.trim(),
    day: document.getElementById("f-day").value,
    mode: document.getElementById("f-mode").value,
    start: document.getElementById("f-start").value,
    end: document.getElementById("f-end").value,
    postponed: existing ? (existing.postponed || false) : false,
    postponedDate: existing ? (existing.postponedDate || null) : null,
    cancelledDates: existing ? (existing.cancelledDates || []) : []
  };
  const docId = id || ("c_" + Date.now() + "_" + Math.random().toString(36).slice(2));
  try {
    setConn("syncing", "Saving...");
    await setDoc(doc(db, "classes", docId), data, { merge: true });
    closeModal();
  } catch (err) {
    console.error(err);
    alert("Could not save. Check connection.");
  }
});

window.toggleMode = async function(id, currentMode) {
  try {
    await updateDoc(doc(db, "classes", id), { mode: currentMode === "online" ? "offline" : "online" });
  } catch (err) { console.error(err); alert("Failed to update mode."); }
};

window.openPostponeModal = function(id) {
  const c = classes.find(x => x.id === id);
  if (!c) return;
  document.getElementById("pp-id").value = id;
  document.getElementById("postpone-sub").innerText = c.subject + " (" + c.day + ", " + c.start + "-" + c.end + ")";
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  document.getElementById("pp-date").value = c.postponedDate || formatDate(tomorrow);
  document.getElementById("postpone-modal").classList.remove("hidden");
};

window.closePostponeModal = function() {
  document.getElementById("postpone-modal").classList.add("hidden");
};

window.confirmPostpone = async function() {
  const id = document.getElementById("pp-id").value;
  const dateVal = document.getElementById("pp-date").value;
  if (!dateVal) { alert("Please pick a date."); return; }
  try {
    setConn("syncing", "Saving...");
    await updateDoc(doc(db, "classes", id), { postponed: true, postponedDate: dateVal });
    closePostponeModal();
  } catch (err) { console.error(err); alert("Failed to postpone."); }
};

window.unpostponeClass = async function(id) {
  try {
    await updateDoc(doc(db, "classes", id), { postponed: false, postponedDate: null });
  } catch (err) { console.error(err); alert("Failed to undo postponement."); }
};

window.deleteClass = async function(id) {
  if (!confirm("Delete this class?")) return;
  try {
    await deleteDoc(doc(db, "classes", id));
  } catch (err) { console.error(err); alert("Failed to delete."); }
};

setInterval(renderAll, 30000);
</script>
</body>
</html>
